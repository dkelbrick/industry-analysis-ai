[project]
name = "industry-analysis-ai"
version = "0.1.0"
description = "Extraction and reconciliation of SA bank financial data (BA900 + published reports)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=15",
    "pdfplumber>=0.11",
    "marimo>=0.9",
    "altair>=5",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankdata"]
